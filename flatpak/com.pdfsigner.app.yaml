# Flatpak manifest for PDFSigner
# Author: Homero Thompson del Lago del Terror
#
# Build: flatpak-builder --force-clean build-dir com.pdfsigner.app.yaml
# Install: flatpak-builder --user --install --force-clean build-dir com.pdfsigner.app.yaml
# Run: flatpak run com.pdfsigner.app

app-id: com.pdfsigner.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: pdfsigner-gui

finish-args:
  # USB tokens access (required for PKCS#11)
  - --device=all

  # Home directory access for PDF files
  - --filesystem=home

  # NSS database (read-only)
  - --filesystem=~/.nss:ro

  # Application config
  - --filesystem=~/.config/pdfsigner:create

  # Display
  - --socket=wayland
  - --socket=fallback-x11

  # Network for TSA timestamps and pip install
  - --share=network

  # DBus for portal access
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gtk.vfs.*

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Main application with all dependencies
  - name: pdfsigner
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Install build backend and dependencies
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir
          hatchling pyhanko[pkcs11] python-pkcs11 pymupdf pydantic-settings
          loguru cryptography certifi urllib3 babel qrcode pillow

      # Install the application itself
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps .

      # Install desktop file
      - install -Dm644 data/com.pdfsigner.app.desktop
          ${FLATPAK_DEST}/share/applications/com.pdfsigner.app.desktop

      # Install metainfo
      - install -Dm644 data/com.pdfsigner.app.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/com.pdfsigner.app.metainfo.xml

      # Install icons
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 data/icons/${size}x${size}/apps/com.pdfsigner.app.png \
            ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/com.pdfsigner.app.png
        done

      # Install screenshots
      - |
        mkdir -p ${FLATPAK_DEST}/share/metainfo/screenshots
        for img in screenshots/*.png; do
          install -Dm644 "$img" ${FLATPAK_DEST}/share/metainfo/screenshots/$(basename "$img")
        done

    sources:
      - type: dir
        path: ..
