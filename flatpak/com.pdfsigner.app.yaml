# Flatpak manifest for PDFSigner
# Author: Homero Thompson del Lago del Terror
#
# Build: flatpak-builder --force-clean build-dir com.pdfsigner.app.yaml
# Install: flatpak-builder --user --install --force-clean build-dir com.pdfsigner.app.yaml
# Run: flatpak run com.pdfsigner.app

app-id: com.pdfsigner.app
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: pdfsigner-gui

finish-args:
  # USB tokens access (required for PKCS#11)
  - --device=all

  # Home directory access for PDF files
  - --filesystem=home

  # NSS database (read-only)
  - --filesystem=~/.nss:ro

  # Application config
  - --filesystem=~/.config/pdfsigner:create

  # Display
  - --socket=wayland
  - --socket=fallback-x11

  # Network for TSA timestamps
  - --share=network

  # DBus for portal access
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gtk.vfs.*

  # Allow opening files via portal
  - --system-talk-name=org.freedesktop.portal.FileChooser

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Python dependencies module
  - name: python-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation
        pyhanko python-pkcs11 pymupdf pydantic-settings loguru
        cryptography certifi urllib3 babel asn1crypto oscrypto
        pyhanko-certvalidator qrcode tzlocal fonttools
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/py3/p/pyhanko/pyhanko-0.25.1-py3-none-any.whl
        sha256: placeholder_sha256_pyhanko
      # Note: In production, generate sources with flatpak-pip-generator
      # pip install flatpak-pip-generator
      # flatpak-pip-generator pyhanko[pkcs11] python-pkcs11 pymupdf pydantic-settings loguru

  # Main application
  - name: pdfsigner
    buildsystem: simple
    build-commands:
      # Install the application
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .

      # Install desktop file
      - install -Dm644 data/com.pdfsigner.app.desktop
          ${FLATPAK_DEST}/share/applications/com.pdfsigner.app.desktop

      # Install metainfo
      - install -Dm644 data/com.pdfsigner.app.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/com.pdfsigner.app.metainfo.xml

      # Install icons
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 data/icons/${size}x${size}/apps/com.pdfsigner.app.png \
            ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/com.pdfsigner.app.png
        done

    sources:
      - type: dir
        path: ..
