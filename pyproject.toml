[project]
name = "pdfsigner"
version = "1.1.0"
description = "Digital PDF signing application with SafeNet 5110 USB token"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Homero Thompson del Lago del Terror" }
]
dependencies = [
    "pyhanko[pkcs11,etsi]>=0.25.0",
    "python-pkcs11>=0.7.0",
    "pymupdf>=1.24.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "cryptography>=46.0.5",
    "certifi>=2024.0.0",
    "urllib3>=2.6.0",
    "babel>=2.17.0",
    "qrcode[pil]>=7.4.0",
    "pillow>=12.1.1",
    "jsonschema>=4.20.0",
    "keyring>=25.0.0",
    "reportlab>=4.4.9",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.22",
    "pyotp>=2.9.0",
    "argon2-cffi>=25.1.0",
    # Security dependencies
    "fastapi-csrf-protect>=0.3.0",
    "defusedxml>=0.7.1",
    "authlib>=1.3.0",
    "werkzeug>=3.1.6",
    "python-magic>=0.4.27",
    "protobuf>=6.33.5",
    "pdfminer-six>=20251230",
    "pynacl>=1.6.2",
    "nltk>=3.9.3",
]
# Note: PyGObject is used from system (python3-gi) for GTK4 bindings

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
pdfsigner = "pdfsigner.main:main"
pdfsigner-gui = "pdfsigner.gui.app:run_gui"
pdfsigner-api = "pdfsigner.api.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsigner"]

[tool.hatch.build.targets.wheel.force-include]
"src/pdfsigner/gui/styles.css" = "pdfsigner/gui/styles.css"
"src/pdfsigner/config/builtin_templates" = "pdfsigner/config/builtin_templates"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]
# E402: Ignorar en archivos GTK (gi.require_version debe ir antes de imports)
# S101: assert is OK in tests and non-production code
ignore = ["E402", "S101"]

[tool.ruff.lint.per-file-ignores]
# Archivos que usan PyGObject necesitan imports después de gi.require_version
"src/pdfsigner/gui/*.py" = ["E402"]
"src/pdfsigner/ui/**/*.py" = ["E402"]
# Tests: allow PascalCase for mock variables (common convention)
"tests/**/*.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "security: marks tests as security-related (cryptography, authentication, etc.)",
    "compliance: marks tests as compliance-related (GDPR, HIPAA, eIDAS)",
    "slow: marks tests as slow-running (> 30s)",
    "pkcs11: marks tests requiring SoftHSM or real PKCS#11 tokens",
    "integration: marks tests as integration tests (require external services)",
    "gui: marks tests as GUI tests (GTK4/libadwaita with mocked display)",
]

[tool.coverage.run]
source = ["src/pdfsigner"]
omit = [
    "src/pdfsigner/gui/*",
    "src/pdfsigner/ui/*",
    "src/pdfsigner/cli/*",
    "src/pdfsigner/i18n/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Demasiados falsos positivos con PyGObject
warn_unused_ignores = true
# Ignorar errores en módulos externos sin stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pyhanko.*",
    "pkcs11.*",
    "fitz.*",
    "gi.*",
]
ignore_errors = true

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "pip-audit>=2.10.0",
    "pytest-cov>=7.0.0",
    "responses>=0.25.8",
    "ruff>=0.14.11",
    "safety>=3.7.0",
]
