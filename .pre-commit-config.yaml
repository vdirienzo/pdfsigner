# Pre-commit hooks configuration
# Author: Homero Thompson del Lago del Terror
#
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --select, "E,F,I,N,W,UP,S", --ignore, "E402,S101"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy-incremental
        name: mypy (incremental - blocks NEW errors only)
        entry: bash scripts/check_mypy_incremental.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-security-patterns
        name: security pattern check
        entry: bash scripts/check_security_patterns.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
